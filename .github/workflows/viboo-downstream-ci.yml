name: Viboo downstream CI

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test compiler and build API server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
            kubernetes_platform/go.sum
      - name: Check Go formatting
        run: |
          gofmt -w \
            backend/src/v2/compiler/argocompiler/argo.go \
            backend/src/v2/compiler/argocompiler/container.go \
            backend/src/v2/compiler/argocompiler/container_test.go
          git diff --exit-code
      - name: Run compiler unit tests
        run: go test ./backend/src/v2/compiler/argocompiler
      - name: Build API server
        run: go build -o apiserver backend/src/apiserver/*.go
      - name: Upload API server
        uses: actions/upload-artifact@v4
        with:
          name: kfp-api-server-linux-amd64
          path: apiserver
          if-no-files-found: error
          retention-days: 30

  frontend-test-and-build:
    name: Test and build frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend checks
        working-directory: frontend
        run: npm run test:ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: COMMIT_HASH=${{ github.sha }}
          outputs: type=docker,dest=/tmp/kfp-frontend-linux-amd64.tar
          platforms: linux/amd64
          push: false
          tags: kfp-frontend:${{ github.sha }}
      - name: Upload frontend image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kfp-frontend-linux-amd64
          path: /tmp/kfp-frontend-linux-amd64.tar
          if-no-files-found: error
          retention-days: 30
